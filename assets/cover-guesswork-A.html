<!doctype html>
<html><head><meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 644px; overflow: hidden; }
  body {
    background: #0F1319; font-family: "Liberation Sans", Arial, sans-serif;
    position: relative; display: flex; align-items: center;
  }
  /* flat blocks only — LinkedIn's recompression mangles gradients */
  .band { position: absolute; left: 0; top: 0; width: 12px; height: 644px; background: #37B98A; }
  .stack { padding: 0 88px; width: 100%; }
  .eyebrow {
    font-family: "DejaVu Sans Mono", monospace;
    font-size: 19px; letter-spacing: 3.4px; text-transform: uppercase;
    color: #7C8798; font-weight: 700; margin-bottom: 30px;
  }
  h1 {
    font-size: 96px; line-height: 1.02; letter-spacing: -3.6px;
    color: #F2F5F8; font-weight: 700;
  }
  h1 em { font-style: normal; color: #37B98A; }
  .rule { width: 132px; height: 5px; background: #37B98A; margin: 40px 0 26px; }
  .sub {
    font-size: 29px; color: #97A3B2; font-weight: 400; letter-spacing: -0.2px;
  }
  .sub b { color: #F2F5F8; font-weight: 700; }
  .foot {
    position: absolute; left: 88px; bottom: 52px;
    font-family: "DejaVu Sans Mono", monospace; font-size: 18px;
    letter-spacing: 3px; text-transform: uppercase; color: #6F7A8A; font-weight: 700;
  }
</style></head>
<body>
  <div class="band"></div>
  <div class="stack">
    <div class="eyebrow">Substance use &middot; The family carrying it</div>
    <h1>Guidance instead<br>of <em>guesswork.</em></h1>
    <div class="rule"></div>
    <div class="sub">Support that reaches the employee <b>and the person they love.</b></div>
  </div>
  <div class="foot">Sobrynth</div>
</body></html>
