<!doctype html>
<html><head><meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 1200px; overflow: hidden; }
  body {
    background: #0F1319; font-family: "Liberation Sans", Arial, sans-serif;
    position: relative; display: flex; align-items: center;
  }
  .band { position: absolute; left: 0; top: 0; width: 14px; height: 1200px; background: #37B98A; }
  .stack { padding: 0 110px; width: 100%; }
  h1 {
    font-size: 132px; line-height: 1.03; letter-spacing: -5px;
    color: #F2F5F8; font-weight: 700;
  }
  h1 em { font-style: normal; color: #37B98A; }
  .foot {
    position: absolute; left: 110px; bottom: 92px;
    font-family: "DejaVu Sans Mono", monospace; font-size: 22px;
    letter-spacing: 3px; text-transform: uppercase; color: #6F7A8A; font-weight: 700;
  }
</style></head>
<body>
  <div class="band"></div>
  <div class="stack">
    <h1>Willpower<br><em>doesn't scale.</em></h1>
  </div>
  <div class="foot">Jess Ferretti &middot; Fractional VP of Sales</div>
</body></html>
