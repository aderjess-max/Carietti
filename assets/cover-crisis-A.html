<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="cover-sobrynth.css">
<style>
  body { background: var(--paper); }
  .panel {
    position: absolute; right: 0; top: 0; width: 340px; height: 644px;
    background: var(--lilac); display: flex; align-items: center; justify-content: center;
  }
  .panel img { width: 182px; }
  .stack { position: absolute; left: 76px; top: 172px; width: 740px; }
  .eyebrow { color: var(--grey); }
  .figure {
    font-family: var(--display); font-weight: 700; font-size: 128px; line-height: 1;
    letter-spacing: -4px; color: var(--orange); margin-bottom: 10px;
  }
  .caption { font-size: 23px; color: var(--grey); margin-bottom: 40px; }
  .caption b { color: var(--ink); font-weight: 700; }
  h1 { font-size: 54px; line-height: 1.1; letter-spacing: -1.2px; color: var(--purple-deep); }
  .foot { color: var(--purple-mid); }
</style></head>
<body>
  <div class="panel"><img src="sobrynth/mark-maze.png" alt=""></div>
  <img class="logo" src="sobrynth/logo-full-color.png" alt="Sobrynth">
  <div class="stack">
    <div class="eyebrow">The moment that never made a record</div>
    <div class="figure">2:00 PM</div>
    <div class="caption">Five years sober. One difficult afternoon. <b>One phone call.</b></div>
    <h1>The crisis that<br>never happened.</h1>
  </div>
  <div class="foot">Sobrynth.com</div>
</body></html>
