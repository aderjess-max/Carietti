<!doctype html>
<html><head><meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1128px; height:191px; overflow:hidden; }
  body { background:#0F1319; font-family:"Liberation Sans", Arial, sans-serif;
         position:relative; display:flex; align-items:center; }
  .band { position:absolute; left:0; top:0; width:7px; height:191px; background:#37B98A; }
  .stack { padding-left:62px; }
  .eyebrow { font-family:"DejaVu Sans Mono", monospace; font-size:13px; letter-spacing:2.6px;
             text-transform:uppercase; color:#6F7A8A; font-weight:700; margin-bottom:11px; }
  h1 { font-size:38px; line-height:1.12; letter-spacing:-1.2px; color:#F2F5F8; font-weight:700; }
  h1 em { font-style:normal; color:#37B98A; }
</style></head>
<body>
  <div class="band"></div>
  <div class="stack">
    <div class="eyebrow">The Carietti Group &middot; Digital Health</div>
    <h1>Founder-led sales &rarr; a real sales team.<br><em>Six months. Then we hire the VP.</em></h1>
  </div>
</body></html>
