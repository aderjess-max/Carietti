<!doctype html>
<html><head><meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 1200px; overflow: hidden; }
  body {
    background: #0F1319; font-family: "Liberation Sans", Arial, sans-serif;
    position: relative; display: flex; align-items: center;
  }
  .band { position: absolute; left: 0; top: 0; width: 14px; height: 1200px; background: #37B98A; }
  .stack { padding: 0 105px; width: 100%; }
  .eyebrow {
    font-family: "DejaVu Sans Mono", monospace; font-size: 23px;
    letter-spacing: 4px; text-transform: uppercase; color: #6F7A8A;
    font-weight: 700; margin-bottom: 40px;
  }
  h1 {
    font-size: 88px; line-height: 1.12; letter-spacing: -3.2px;
    color: #F2F5F8; font-weight: 700;
  }
  h1 em { font-style: normal; color: #37B98A; }
  .foot {
    position: absolute; left: 105px; bottom: 88px;
    font-family: "DejaVu Sans Mono", monospace; font-size: 21px;
    letter-spacing: 3px; text-transform: uppercase; color: #6F7A8A; font-weight: 700;
  }
</style></head>
<body>
  <div class="band"></div>
  <div class="stack">
    <div class="eyebrow">Getting sober taught me this</div>
    <h1>Willpower doesn't scale.<br><em>Neither does founder-led sales.</em></h1>
  </div>
  <div class="foot">Jess Ferretti &middot; Fractional VP of Sales</div>
</body></html>
