<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="cover-sobrynth.css">
<style>
  body { background: var(--paper); }
  .panel {
    position: absolute; right: 0; top: 0; width: 386px; height: 644px;
    background: var(--lilac); display: flex; align-items: center; justify-content: center;
  }
  .panel img { width: 206px; }
  .stack { position: absolute; left: 76px; top: 196px; width: 720px; }
  .eyebrow { color: var(--grey); }
  h1 { font-size: 72px; line-height: 1.08; letter-spacing: -1.6px; color: var(--purple-deep); }
  h1 em { color: var(--orange); }
  .sub { margin-top: 34px; color: var(--grey); width: 700px; }
  .sub b { color: var(--ink); }
  .foot { color: var(--purple-mid); }
</style></head>
<body>
  <div class="panel"><img src="sobrynth/mark-maze.png" alt=""></div>
  <img class="logo" src="sobrynth/logo-full-color.png" alt="Sobrynth">
  <div class="stack">
    <div class="eyebrow">Substance use &middot; The family carrying it</div>
    <h1>Guidance instead<br>of <em>guesswork.</em></h1>
    <div class="sub">For the employee &mdash; <b>and the person they love.</b></div>
  </div>
  <div class="foot">Sobrynth.com</div>
</body></html>
