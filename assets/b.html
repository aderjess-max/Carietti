<!doctype html>
<html><head><meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1584px; height: 396px; overflow: hidden; }
  body { background: #0F1319; font-family: "Liberation Sans", Arial, sans-serif; position: relative; }

  .band { position: absolute; left: 0; top: 0; width: 8px; height: 396px; background: #37B98A; }

  .stack { position: absolute; left: 440px; top: 50%; transform: translateY(-50%); }

  .eyebrow {
    font-family: "DejaVu Sans Mono", monospace;
    font-size: 18px; letter-spacing: 3.2px; text-transform: uppercase;
    color: #7C8798; font-weight: 700; margin-bottom: 24px;
  }
  h1 {
    font-size: 76px; line-height: 1.1; letter-spacing: -2.6px;
    color: #F2F5F8; font-weight: 700; white-space: nowrap;
  }
  h1 em { font-style: normal; color: #37B98A; }
  .sub {
    margin-top: 26px; font-size: 28px; color: #97A3B2;
    font-weight: 400; letter-spacing: -0.2px; white-space: nowrap;
  }
</style></head>
<body>
  <div class="band"></div>
  <div class="stack">
    <div class="eyebrow">Fractional VP of Sales &middot; Digital Health</div>
    <h1>I'm hired to make myself<br><em>unnecessary.</em></h1>
    <div class="sub">23 years selling &middot; Quotas to $12M &middot; Spring Health, Koa Health, Sobrynth</div>
  </div>
</body></html>
