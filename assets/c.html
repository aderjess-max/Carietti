<!doctype html>
<html><head><meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1584px; height: 396px; overflow: hidden; }
  body { background: #F4F6F4; font-family: "Liberation Sans", Arial, sans-serif; position: relative; }

  .band { position: absolute; left: 0; top: 0; width: 8px; height: 396px; background: #1B6B51; }

  .stack { position: absolute; left: 440px; top: 50%; transform: translateY(-50%); }

  .eyebrow {
    font-family: "DejaVu Sans Mono", monospace;
    font-size: 18px; letter-spacing: 3.2px; text-transform: uppercase;
    color: #5D6B62; font-weight: 700; margin-bottom: 22px;
  }
  h1 {
    font-size: 74px; line-height: 1.1; letter-spacing: -2.4px;
    color: #121A15; font-weight: 700; white-space: nowrap;
  }
  .arrow { color: #1B6B51; font-weight: 400; }
  .sub {
    margin-top: 26px; font-size: 29px; color: #4A574F;
    font-weight: 400; letter-spacing: -0.2px; white-space: nowrap;
  }
  .sub b { color: #121A15; font-weight: 700; }
</style></head>
<body>
  <div class="band"></div>
  <div class="stack">
    <div class="eyebrow">Fractional VP of Sales &middot; Digital Health</div>
    <h1>Founder-led sales <span class="arrow">&rarr;</span><br>a real sales team.</h1>
    <div class="sub">Six months. Then I hire the VP who <b>replaces me</b>.</div>
  </div>
</body></html>
